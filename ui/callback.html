<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing in...</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

<p>Signing you in...</p>

<script src="app.js"></script>

<script>

(async function () {

    try {

        const result =
            await handleKeycloakCallback();

        console.log("Keycloak callback result:", result);

        /*
         * Redirect back to the app after the auth code exchange succeeds.
         * Use replace() so the callback page is not left in browser history.
         */
        window.location.replace("/index.html");

    } catch (error) {

        console.error(error);

        document.body.innerHTML = `
            <h3>Login failed</h3>
            <p>${error.message}</p>
            <a href="/index.html">Return to assistant</a>
        `;
    }

})();

</script>

</body>
</html>
